name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Every build is published under v/<hash>/ so module imports and data fetches (all relative) are
      # cache-busted together; index.html reads version.json (never cached) to find the current folder.
      - name: Stamp build
        run: |
          SHORT="${GITHUB_SHA::7}"
          mkdir -p "_site/v/${SHORT}"
          cp -r src data style.css "_site/v/${SHORT}/"
          cp index.html .nojekyll _site/
          # the gallery is versioned like the game: /gallery/ is a tiny loader that finds the current build via
          # version.json, and the code and data it runs live under v/<hash>/ (same relative layout as the repo)
          cp -r gallery _site/gallery
          cp -r gallery "_site/v/${SHORT}/gallery"
          mkdir -p "_site/v/${SHORT}/tools/sprite-lab"
          cp -r tools/sprite-lab/variants "_site/v/${SHORT}/tools/sprite-lab/variants"
          sed -i "s/__BUILD__/${SHORT}/g" _site/index.html
          printf '{"hash":"%s","full":"%s","built":"%s"}\n' \
            "$SHORT" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
          cat _site/version.json
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
