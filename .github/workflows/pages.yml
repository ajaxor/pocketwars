name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build
        run: |
          SHORT="${GITHUB_SHA::7}"
          mkdir _site
          cp index.html style.css game.js .nojekyll _site/
          sed -i "s/__BUILD__/${SHORT}/g" _site/index.html
          printf '{"hash":"%s","full":"%s","built":"%s"}\n' \
            "$SHORT" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
          cat _site/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
