name: Retune the computer opponent

# The strategist AI's numbers (data/ai.json engines.strategist) are tuned by playing it against itself (tools/ai/tune.mjs).
# After a change to the units, weapons, leaders, rules, strategies, maps or the AI's own code, the tuning is out of date: this
# workflow tunes again, and commits the result only when it beats the profile already shipped over every map. It also runs every
# week to keep improving, and can be started by hand (Actions > Retune the computer opponent > Run workflow).

on:
  push:
    branches: [main]
    paths:
      - 'data/units.json'
      - 'data/weapons.json'
      - 'data/loadouts.json'
      - 'data/rules.json'
      - 'data/terrain.json'
      - 'data/ai-strategies.json'
      - 'data/maps/**'
      - 'src/ai/strategist/**'
  schedule:
    - cron: '17 9 * * 1'   # Mondays: keep improving
  workflow_dispatch:
    inputs:
      sessions:
        description: 'Short sessions to run, each shipped on its own'
        default: '6'
      minutes:
        description: 'Minutes per session'
        default: '10'

permissions:
  contents: write   # to commit data/ai.json
  actions: write    # to start the Pages deploy afterwards (a bot commit does not trigger it by itself)

concurrency:
  group: ai-tune
  cancel-in-progress: true

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # Short sessions, each shipped (validated, tested, committed, pushed) before the next starts: a failure late in the run
      # cannot lose what the earlier sessions found.
      - name: Tune in short sessions
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node tools/ai/ratchet.mjs --sessions 1 --minutes 15 --if-stale --commit --push
          else
            node tools/ai/ratchet.mjs --sessions "${{ inputs.sessions || 6 }}" --minutes "${{ inputs.minutes || 10 }}" --commit --push
          fi
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tune-log
          path: tools/ai/out/
          if-no-files-found: ignore
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$START" ]; then gh workflow run pages.yml --ref main; else echo "nothing shipped"; fi
