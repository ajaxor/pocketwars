<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Wars">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2436">
<meta name="description" content="Pocket Wars: a turn-based tactics game for your phone browser. Capture the enemy HQ.">
<meta property="og:title" content="Pocket Wars">
<meta property="og:description" content="A turn-based tactics game for your phone browser. Capture the enemy HQ.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d2436'/%3E%3Crect x='6' y='16' width='20' height='8' rx='2' fill='%23e8712c'/%3E%3Crect x='11' y='10' width='10' height='7' rx='2' fill='%239a3f0e'/%3E%3Crect x='19' y='12' width='9' height='2' fill='%23f3ecd6'/%3E%3C/svg%3E">
<title>Pocket Wars</title>
<!-- Shell: stays tiny and stable. It reads version.json (fetched with no-store) to find the build folder (v/<hash>/, see
     .github/workflows/pages.yml) and hands over to src/launcher.js from that build, so every module, style and data file a
     reload touches is new. The title screen, its styles and the loading logic all live in that build (src/launcher.js,
     src/ui/title-screen.js, style.css), not here. -->
<style>
html,body{height:100%;margin:0;background:#1d2436}
body.loading>:not(#boot){visibility:hidden}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#f3ecd6;font:600 14px ui-monospace,Menlo,monospace;text-align:center;padding:24px;box-sizing:border-box}
#boot button{font:800 16px ui-monospace,Menlo,monospace;color:#f3ecd6;background:#e8712c;border:3px solid #f3ecd6;border-radius:10px;padding:10px 28px}
</style></head><body class="loading">
<div id="boot"><div id="boot-msg">Loading...</div></div>
<div id="hud"><div><div id="t"></div><div id="f"></div></div><div id="bar"><button id="undo" disabled>Undo</button><button id="end">End turn</button></div></div>
<canvas id="c"></canvas><div id="msg"></div><div id="btns"></div>

<script>
(()=>{
// BUILD is replaced with the short commit hash by the deploy workflow. Unreplaced = local/dev copy.
const BUILD='__BUILD__',DEV=BUILD.startsWith('__');
const getVersion=async()=>{try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch(e){return null}};
const goTo=h=>{const q=new URLSearchParams(location.search);q.set('v',h);location.replace(location.pathname+'?'+q)};
(async()=>{
  const v=await getVersion();
  // The shell itself may be a stale cached copy: jump to a fresh URL once if the build differs.
  if(v&&!DEV&&v.hash!==BUILD&&new URLSearchParams(location.search).get('v')!==v.hash){goTo(v.hash);return}
  // Deployed builds live in v/<hash>/; a local checkout (or a site without version.json) serves from the repo root.
  const base=v&&!DEV?'v/'+v.hash+'/':'./',tag=v&&!DEV?v.hash:String(Date.now());
  try{
    const m=await import(new URL(base+'src/launcher.js?v='+tag,location.href).href);
    await m.launch({base,tag,hash:v?v.hash:'dev',built:v&&v.built,getVersion,goTo});
  }catch(e){
    console.error(e);
    document.body.classList.remove('loading');
    document.getElementById('boot-msg').textContent='Could not load the game: '+String(e.message||e).split('\n')[0].slice(0,120);
    const b=document.createElement('button');b.textContent='Retry';b.onclick=()=>location.reload();document.getElementById('boot').append(b);
  }
})();
})();
</script></body></html>
